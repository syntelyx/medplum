services:
  postgres:
    image: postgres:16
    restart: always
    networks:
      - medplum-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-medplum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-medplum}
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    command:
      - 'postgres'
      - '-c'
      - 'listen_addresses=*'
      - '-c'
      - 'statement_timeout=60000'
      - '-c'
      - 'default_transaction_isolation=REPEATABLE READ'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements,auto_explain'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-medplum}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    networks:
      - medplum-network
    command: redis-server --requirepass ${REDIS_PASSWORD:-medplum}
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-medplum}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Medplum server container
  medplum-server:
    image: medplum/medplum-server:latest
    restart: always
    networks:
      - medplum-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8103:8103'
    command: ['env']
    environment:
      MEDPLUM_PORT: ${MEDPLUM_PORT:-8103}
      MEDPLUM_BASE_URL: '${MEDPLUM_BASE_URL:-http://localhost:8103/}'
      MEDPLUM_APP_BASE_URL: '${MEDPLUM_APP_BASE_URL:-http://localhost:3000/}'
      MEDPLUM_STORAGE_BASE_URL: '${MEDPLUM_STORAGE_BASE_URL:-http://localhost:8103/storage/}'

      MEDPLUM_DATABASE_HOST: '${MEDPLUM_DATABASE_HOST:-postgres}'
      MEDPLUM_DATABASE_PORT: ${MEDPLUM_DATABASE_PORT:-5432}
      MEDPLUM_DATABASE_DBNAME: '${MEDPLUM_DATABASE_DBNAME:-medplum}'
      MEDPLUM_DATABASE_USERNAME: '${MEDPLUM_DATABASE_USERNAME:-medplum}'
      MEDPLUM_DATABASE_PASSWORD: '${MEDPLUM_DATABASE_PASSWORD:-medplum}'

      MEDPLUM_REDIS_HOST: '${MEDPLUM_REDIS_HOST:-redis}'
      MEDPLUM_REDIS_PORT: ${MEDPLUM_REDIS_PORT:-6379}
      MEDPLUM_REDIS_PASSWORD: '${MEDPLUM_REDIS_PASSWORD:-medplum}'

      MEDPLUM_BINARY_STORAGE: '${MEDPLUM_BINARY_STORAGE:-file:./binary/}'
      MEDPLUM_SUPPORT_EMAIL: '${MEDPLUM_SUPPORT_EMAIL:-"Medplum" <support@medplum.com>}'
      MEDPLUM_GOOGLE_CLIENT_ID: '${MEDPLUM_GOOGLE_CLIENT_ID:-397236612778-c0b5tnjv98frbo1tfuuha5vkme3cmq4s.apps.googleusercontent.com}'
      MEDPLUM_GOOGLE_CLIENT_SECRET: '${MEDPLUM_GOOGLE_CLIENT_SECRET:-}'
      MEDPLUM_RECAPTCHA_SITE_KEY: '${MEDPLUM_RECAPTCHA_SITE_KEY:-6LfHdsYdAAAAAC0uLnnRrDrhcXnziiUwKd8VtLNq}'
      MEDPLUM_RECAPTCHA_SECRET_KEY: '${MEDPLUM_RECAPTCHA_SECRET_KEY:-6LfHdsYdAAAAAH9dN154jbJ3zpQife3xaiTvPChL}'
      MEDPLUM_MAX_JSON_SIZE: '${MEDPLUM_MAX_JSON_SIZE:-1mb}'
      MEDPLUM_MAX_BATCH_SIZE: '${MEDPLUM_MAX_BATCH_SIZE:-50mb}'
      MEDPLUM_BOT_LAMBDA_ROLE_ARN: '${MEDPLUM_BOT_LAMBDA_ROLE_ARN:-}'
      MEDPLUM_BOT_LAMBDA_LAYER_NAME: '${MEDPLUM_BOT_LAMBDA_LAYER_NAME:-medplum-bot-layer}'
      MEDPLUM_VM_CONTEXT_BOTS_ENABLED: '${MEDPLUM_VM_CONTEXT_BOTS_ENABLED:-true}'
      MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION: '${MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION:-vmcontext}'
      MEDPLUM_ALLOWED_ORIGINS: '${MEDPLUM_ALLOWED_ORIGINS:-*}'
      MEDPLUM_INTROSPECTION_ENABLED: '${MEDPLUM_INTROSPECTION_ENABLED:-true}'
      MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS: ${MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS:-30000}

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:8103/healthcheck").then(r => r.json()).then(console.log).catch(() => { process.exit(1); })',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Medplum app container (web UI)
  medplum-app:
    image: medplum/medplum-app:latest
    restart: always
    networks:
      - medplum-network
    depends_on:
      medplum-server:
        condition: service_healthy
    ports:
      - '3004:3000'
    environment:
      MEDPLUM_BASE_URL: '${MEDPLUM_BASE_URL:-http://localhost:8103/}'
      MEDPLUM_CLIENT_ID: '${MEDPLUM_CLIENT_ID:-}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-397236612778-c0b5tnjv98frbo1tfuuha5vkme3cmq4s.apps.googleusercontent.com}'
      RECAPTCHA_SITE_KEY: '${RECAPTCHA_SITE_KEY:-6LfHdsYdAAAAAC0uLnnRrDrhcXnziiUwKd8VtLNq}'
      MEDPLUM_REGISTER_ENABLED: '${MEDPLUM_REGISTER_ENABLED:-true}'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medplum-postgres-data:


networks:
  medplum-network:
    driver: bridge